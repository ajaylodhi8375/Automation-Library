<title>Automation Library</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: sticky header (search, update data, theme), left collection tree, right reading pane.
   Colour: one hue (--h) drives every neutral and the accent, so a palette is just a number. */
:root{
  --h:222; --al:42%;
  --bg:hsl(var(--h) 24% 97%); --panel:hsl(var(--h) 30% 100%); --panel2:hsl(var(--h) 22% 94%); --line:hsl(var(--h) 18% 87%);
  --fg:hsl(var(--h) 30% 12%); --muted:hsl(var(--h) 12% 36%); --faint:hsl(var(--h) 10% 46%);
  --accent:hsl(var(--h) 72% var(--al)); --accent-soft:hsl(var(--h) 80% 94%); --accent-fg:#fff;
  --code-bg:hsl(var(--h) 22% 95%);
  --ok:hsl(145 60% 26%); --ok-bg:hsl(145 45% 91%); --warn:hsl(32 90% 28%); --warn-bg:hsl(40 90% 90%);
  --bad:hsl(0 65% 40%); --bad-bg:hsl(0 80% 94%);
  --sans:"Schibsted Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --hh:56px;
}
:root[data-palette="teal"]{--h:175;--al:28%}
:root[data-palette="forest"]{--h:145;--al:28%}
:root[data-palette="amber"]{--h:36;--al:30%}
:root[data-palette="rose"]{--h:335;--al:42%}
:root[data-palette="violet"]{--h:265;--al:48%}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:hsl(var(--h) 22% 8%); --panel:hsl(var(--h) 20% 11%); --panel2:hsl(var(--h) 18% 15%); --line:hsl(var(--h) 16% 22%);
  --fg:hsl(var(--h) 25% 93%); --muted:hsl(var(--h) 12% 70%); --faint:hsl(var(--h) 10% 58%);
  --accent:hsl(var(--h) 85% 68%); --accent-soft:hsl(var(--h) 40% 19%); --accent-fg:hsl(var(--h) 30% 9%); --code-bg:hsl(var(--h) 22% 7%);
  --ok:hsl(145 50% 66%); --ok-bg:hsl(145 30% 16%); --warn:hsl(38 85% 66%); --warn-bg:hsl(38 40% 17%);
  --bad:hsl(0 80% 74%); --bad-bg:hsl(0 35% 19%); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:hsl(var(--h) 22% 8%); --panel:hsl(var(--h) 20% 11%); --panel2:hsl(var(--h) 18% 15%); --line:hsl(var(--h) 16% 22%);
  --fg:hsl(var(--h) 25% 93%); --muted:hsl(var(--h) 12% 70%); --faint:hsl(var(--h) 10% 58%);
  --accent:hsl(var(--h) 85% 68%); --accent-soft:hsl(var(--h) 40% 19%); --accent-fg:hsl(var(--h) 30% 9%); --code-bg:hsl(var(--h) 22% 7%);
  --ok:hsl(145 50% 66%); --ok-bg:hsl(145 30% 16%); --warn:hsl(38 85% 66%); --warn-bg:hsl(38 40% 17%);
  --bad:hsl(0 80% 74%); --bad-bg:hsl(0 35% 19%); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--hh) + 16px)}
body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--panel);z-index:60}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono)}
.shell{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--panel);border-bottom:1px solid var(--line);height:var(--hh)}
.hdr .in{height:100%;display:flex;align-items:center;gap:12px;max-width:1500px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;color:var(--fg)}
.brand:hover{text-decoration:none}
.brand .mark{display:grid;grid-template-columns:repeat(3,7px);gap:2px}
.brand .mark i{width:7px;height:7px;border-radius:2px;display:block;background:var(--accent)}
.brand .mark i:nth-child(2n){opacity:.55}.brand .mark i:nth-child(3n){opacity:.3}
.srch{position:relative;flex:1;min-width:0;max-width:620px;margin-left:auto}
.srch input{width:100%;height:38px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:0 44px 0 38px;outline:none}
.srch input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.srch svg{position:absolute;left:11px;top:11px;width:16px;height:16px;color:var(--faint)}
.srch kbd{position:absolute;right:9px;top:8px;font:500 11px var(--mono);color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:var(--panel)}
.res{position:absolute;left:0;right:0;top:44px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 40px rgba(0,0,0,.25);max-height:min(70vh,560px);overflow:auto;z-index:70;padding:6px}
.res .item{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;padding:8px 10px;border-radius:7px;cursor:pointer;align-items:start}
.res .item[aria-selected="true"],.res .item:hover{background:var(--accent-soft)}
.res .ty{font:700 11px var(--mono);width:24px;height:24px;border-radius:6px;display:grid;place-items:center;background:var(--panel2);color:var(--muted);margin-top:1px}
.res .t{font:600 14px var(--sans);overflow-wrap:anywhere}
.res .t b{color:var(--accent)}
.res .s{font-size:12.5px;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.res .none{padding:18px;color:var(--muted);text-align:center}
.btn{height:36px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:0 12px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;font-size:13px;color:var(--fg)}
.btn:hover{background:var(--panel2);text-decoration:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.pri:hover{filter:brightness(1.07);background:var(--accent)}
.menu{display:none;padding:0 10px}
.hdr .right{display:flex;gap:8px;position:relative}
.pop{position:absolute;right:0;top:44px;width:min(320px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.25);padding:14px;z-index:80}
.pop h6{margin:0 0 8px;font:600 11px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.pop h6:not(:first-child){margin-top:16px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--bg)}
.seg button{border:0;background:none;padding:7px 4px;cursor:pointer;font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;justify-content:center}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);font-weight:600}
.pals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pals button{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 6px 7px;cursor:pointer;display:grid;gap:6px;justify-items:center;font-size:12px;color:var(--muted)}
.pals button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);color:var(--fg);font-weight:600}
.pals i{width:34px;height:20px;border-radius:6px;display:block}

.wrap{display:grid;grid-template-columns:300px minmax(0,1fr);gap:0 40px;max-width:1500px;margin:0 auto}
.side{position:sticky;top:calc(var(--hh) + env(safe-area-inset-top,0px));height:calc(100dvh - var(--hh) - env(safe-area-inset-top,0px));overflow:auto;padding:16px 20px 40px 0;border-right:1px solid var(--line);margin-right:-20px}
.main{min-width:0;padding:28px 0 90px;max-width:1040px}
.side h6{font:600 11px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:18px 0 6px;padding:0 6px}
.side h6:first-child{margin-top:0}
.tfilter{width:100%;height:32px;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:0 10px;outline:none;font-size:13px;margin-bottom:6px}
.tfilter:focus{border-color:var(--accent)}
.node>.row{display:flex;align-items:center;gap:6px;border-radius:7px;padding:4px 6px;cursor:pointer;min-height:30px;color:var(--fg)}
.node>.row:hover{background:var(--panel2);text-decoration:none}
.node.cur>.row{background:var(--accent-soft)}
.chev{width:16px;height:16px;flex:none;border:0;background:none;color:var(--faint);cursor:pointer;display:grid;place-items:center;padding:0;transition:transform .12s}
.node.open>.row .chev{transform:rotate(90deg)}
.node .nm{flex:1;min-width:0;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .ct{font:500 11px var(--mono);color:var(--faint)}
.kids{display:none;margin:2px 0 8px 15px;border-left:1px solid var(--line);padding-left:6px}
.node.open>.kids{display:block}
.kid{display:flex;gap:6px;align-items:baseline;padding:3px 8px;border-radius:6px;font:400 13px/1.45 var(--sans);color:var(--muted)}
.kid span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kid .n{font:500 11px var(--mono);color:var(--faint)}
.kid:hover{background:var(--panel2);color:var(--fg);text-decoration:none}
.kid.cur{background:var(--accent-soft);color:var(--accent);font-weight:600}
.lnk{display:block;padding:5px 8px;border-radius:7px;font-size:13.5px;color:var(--fg)}
.lnk:hover{background:var(--panel2);text-decoration:none}
.lnk.cur{background:var(--accent-soft);color:var(--accent);font-weight:600}

.crumb{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px}
.crumb a{color:var(--muted)} .crumb a:hover{color:var(--accent)}
h1{font-size:clamp(26px,4.2vw,38px);line-height:1.14;letter-spacing:-.025em;margin:0 0 10px;font-weight:700;text-wrap:balance;overflow-wrap:anywhere}
h2{font-size:19px;letter-spacing:-.01em;margin:34px 0 12px;font-weight:700}
h3{font-size:14px;margin:22px 0 6px;color:var(--muted);font-weight:600}
.lede{color:var(--muted);font-size:16.5px;max-width:68ch;margin:0 0 20px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.bdg{font:600 11px var(--sans);letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.bdg.ok{background:var(--ok-bg);color:var(--ok)} .bdg.warn{background:var(--warn-bg);color:var(--warn)} .bdg.bad{background:var(--bad-bg);color:var(--bad)} .bdg.acc{background:var(--accent-soft);color:var(--accent)}
.stats{display:flex;flex-wrap:wrap;gap:12px 38px;margin:6px 0 10px}
.stat b{display:block;font:700 32px/1.1 var(--mono);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{display:block;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;color:var(--fg);min-width:0}
a.card:hover{border-color:var(--accent);text-decoration:none}
.card .h{display:flex;align-items:baseline;gap:8px;font:700 15.5px var(--sans)}
.card .h .n{margin-left:auto;font:500 12px var(--mono);color:var(--faint)}
.card .m{font-size:12.5px;line-height:1.6;color:var(--muted);margin-top:6px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.panel h3{margin:0 0 12px;color:var(--fg);font-size:14.5px}
.panel .sub{font-size:12.5px;color:var(--muted);margin:-8px 0 12px}

.rb{display:grid;gap:3px}
.rb button{display:grid;grid-template-columns:minmax(80px,38%) minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;border:0;background:none;padding:4px 6px;border-radius:7px;cursor:pointer;text-align:left}
.rb button:hover{background:var(--accent-soft)}
.rb .l{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb .tr{height:10px;background:var(--panel2);border-radius:3px 5px 5px 3px;overflow:hidden}
.rb .f{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.rb .v{font:500 12.5px var(--mono);color:var(--muted);min-width:28px;text-align:right;font-variant-numeric:tabular-nums}
.chart{overflow-x:auto}
.chart svg{display:block;min-width:560px;width:100%;height:auto}
.chart text{font:500 11px var(--mono);fill:var(--muted)}
.chart .bar{fill:var(--accent);cursor:pointer}
.chart .bar:hover{filter:brightness(1.15)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .val{fill:var(--fg);font-weight:600}
.tip{position:fixed;z-index:90;pointer-events:none;background:var(--fg);color:var(--bg);padding:5px 9px;border-radius:7px;font-size:12.5px;white-space:nowrap}

.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:0 0 12px}
.tools .q{flex:1 1 240px;min-width:0}
.fld{display:grid;gap:3px;min-width:0}
.fld span{font:600 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.fld select,.fld input{height:36px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:0 10px;outline:none;font-size:13.5px;max-width:100%;min-width:0}
.fld select:focus,.fld input:focus{border-color:var(--accent)}
.cnt{font-size:13px;color:var(--muted);margin:0 0 8px}
.tbl{border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.thead,.trow{display:grid;gap:4px 16px;padding:10px 14px}
.thead{font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--faint);background:var(--panel2)}
.trow{border-top:1px solid var(--line);color:var(--fg);align-items:start}
a.trow:hover{background:var(--accent-soft);text-decoration:none}
.c-pl{grid-template-columns:minmax(0,2.2fr) minmax(0,1.2fr) minmax(0,.8fr) minmax(0,.8fr) minmax(0,.9fr) minmax(0,1fr)}
.c-im{grid-template-columns:minmax(0,2.6fr) minmax(0,1.2fr) minmax(0,.9fr) minmax(0,1fr) minmax(0,.8fr)}
.c-gn{grid-template-columns:repeat(var(--cols,4),minmax(0,1fr))}
.trow .t{font-weight:600;font-size:14px;overflow-wrap:anywhere;min-width:0}
.trow .t small{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.trow .x{font-size:13px;color:var(--muted);overflow-wrap:anywhere;min-width:0}
.trow .lab{display:none}
.more{display:flex;justify-content:center;padding:14px}
.empty{padding:34px 18px;text-align:center;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px 24px;margin:16px 0 8px;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.facts dt{font:600 11px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin-bottom:2px}
.facts dd{margin:0;font-size:14px;overflow-wrap:anywhere}
.txt{white-space:pre-wrap;overflow-wrap:anywhere;max-width:76ch;margin:0 0 8px}
.lks{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.lk{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid var(--line);background:var(--panel);border-radius:8px;font-size:13px;color:var(--fg)}
.lk:hover{border-color:var(--accent);color:var(--accent);text-decoration:none}
.lk::after{content:"↗";font-size:11px;color:var(--faint)}
details.raw{margin:6px 0 0;font-size:13px;color:var(--muted)}
details.raw summary{cursor:pointer;padding:2px 0}
details.raw .txt{font:400 12.5px/1.6 var(--mono);background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;max-width:100%}
.pn{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:36px}
.pn a{display:block;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:12px 16px;color:var(--fg);min-width:0}
.pn a:hover{border-color:var(--accent);text-decoration:none}
.pn small{display:block;color:var(--faint);font-size:12px}
.pn span{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.pn a:last-child{text-align:right}
.tcard{display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 12px;padding:14px 16px;border-top:1px solid var(--line)}
.tcard:first-child{border-top:0}
.tcard .no{font:500 12px var(--mono);color:var(--faint);padding-top:3px}
.tcard .tt{font-weight:600}
.tcard .dd{color:var(--muted);font-size:14px}

.drop{display:grid;gap:8px;justify-items:center;text-align:center;border:2px dashed var(--line);border-radius:14px;padding:30px 18px;background:var(--panel);cursor:pointer}
.drop:hover,.drop.on{border-color:var(--accent);background:var(--accent-soft)}
.drop b{font-size:17px}
.drop span{color:var(--muted);font-size:13.5px}
.drop svg{color:var(--accent)}
.msg{border-radius:10px;padding:12px 14px;margin:14px 0;font-size:14px}
.msg.ok{background:var(--ok-bg);color:var(--ok)} .msg.bad{background:var(--bad-bg);color:var(--bad)} .msg.info{background:var(--accent-soft);color:var(--fg)}
.msg b{font-weight:700}
.dl{display:grid;gap:6px;margin:6px 0 0;padding:0;list-style:none;font-size:13.5px}
.dl li{overflow-wrap:anywhere}
.dzo{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:hsl(var(--h) 40% 10% / .72);color:#fff;font-size:22px;font-weight:700;text-align:center;padding:20px}
.dzo div{border:3px dashed #fff;border-radius:18px;padding:40px 50px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:95}
.scrim{display:none}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.tw table{border-collapse:collapse;width:100%;font-size:13.5px}
.tw th{text-align:left;font:600 11px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--faint);background:var(--panel2);padding:9px 12px}
.tw td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
@media (max-width:1100px){.grid2{grid-template-columns:1fr}}
@media (max-width:900px){
  .menu{display:inline-flex}
  .wrap{display:block}
  .side{position:fixed;left:0;top:calc(var(--hh) + env(safe-area-inset-top,0px));bottom:0;height:auto;width:min(88vw,340px);background:var(--panel);z-index:45;transform:translateX(-102%);transition:transform .18s;padding:14px 12px 40px max(14px,env(safe-area-inset-left,0px));margin:0;border-right:1px solid var(--line);visibility:hidden}
  body.nav .side{transform:none;visibility:visible;box-shadow:0 0 40px rgba(0,0,0,.3)}
  body.nav .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:44}
  .main{padding-top:20px}
}
@media (max-width:720px){
  .thead{display:none}
  .c-pl,.c-im,.c-gn{grid-template-columns:minmax(0,1fr)}
  .trow .lab{display:inline;color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-right:6px}
  .pn{grid-template-columns:1fr}.pn a:last-child{text-align:left}
  .btn .lbl,.brand .bt{display:none}
  .srch kbd{display:none}
  .rb button{grid-template-columns:minmax(70px,42%) minmax(0,1fr) auto}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.side,.chev{transition:none}}
</style>

<script>
const BUNDLED = {"file":"Development_-_Automation.xlsx","sheets":[{"name":"Plugins  Software Tools","rows":[["bi","Software/Addin Name","Discipline ","Purpose","Description ","Limitations","Paid/Unpaid","Step by Step - Training Videos ","Revit Version","Responsible person","Testing Status ","Testing Project - Link","Implemented Projects","Link to download the addin's","Trial & Price/month","Category","Conclusion"],[1,"DiRootsOne - 8 Productivity Tools\n\n1).DiRoots - SheetLink","ARC,STR,MEP,Civil 3D","Revit to/from Excel. Export your Revit model data (by categories, elements, schedules) to Excel and Google Sheets. Edit the data and import it back to update the model.\n\nPros:\n\"If we have a lot of sheet and want to do some mass changes then this addin is very helpful\"","Main Features:\n1.Exports Project Standards of revit into excel format: The excel file includes worksheets like Project Information, Model Objecrs, Annotation Objects, Line Styles, List of 2D&3D Families & Instruction. We can edit changes in the excel and import it back into revit using this add-in>import from excel option and then the changes will be updated in the model.\n2.Export model elements data,sheet data, schedules,etc into excel format, then do the changes in excel and import back to revit to reflect the mass changes\n\n\nNOTE-\n-We can delete information in excel but when imported back to revit it will not reflect those information(Only updates/changes are reflected)\n-Rearrangement of rows is not recommeded. Eg,. deleting row-04 and then cut paste information from row-07 will not change the values of row-07 but will change the values of row-04","\n1.parameters like built in parameters,material parameters are not editable in exported excel sheets\n2.Applied filters get remove at a time of export so,this method cant be useful for exporting BOQ schedules\n3.Linked elements can not be exported by sheetlink method\n4.Rearrangement of rows is not recommeded. Eg,. deleting row-04 and then cut paste information from row-07 will not change the values of row-07 but will change the values of row-04","Unpaid","Tutorial video - \nhttps://www.youtube.com/watch?v=QRmhbeNItQU&t=38s\"\n\nhttps://www.youtube.com/watch?v=QoZ24QL35fA\"\n\nhttps://www.youtube.com/watch?v=3rlV2ltk3Vk\"",null,"Faizan","Done","https://www.dropbox.com/work/Arnav%20Jain/Training%20Calendar-2023/Automation%20repository-Faizan/Testing%20Projects/%23Add-ins/DiRoots%20-%20SheetLink",null,"Techture drive link -\nhttps://www.dropbox.com/work/Arnav%20Jain/Training%20Calendar-2023/Automation%20repository-Faizan/Add-in%20Setups\n\nOfficial website link-\nhttps://apps.autodesk.com/RVT/en/Detail/Index?id=6035794126247149351&appLang=en&os=Win64","NA","Sheets and Models","Implement"],[2,"DiRootsOne - 8 Productivity Tools\n\n2).DiRoots - Family Reviser","ARC,STR,MEP,Civil 3D","This addin manages Revit families and Worksets.\nIt renames families, different workset filters out, exports data to excel","Manages Revit families (rename, add prefix and suffix, save them in an organized way) and worksets (modify worksets by category or create your own rules).\n\nMain Features:\n1.Easily export/save revit families(By category or By Family name or By Type name) in an organised way\n2.Add prefix and/or suffix to a Family name or Type name\n3.Find and replace Family name or Type name\n4.Create and manage worksets \n5.Add any familes directly into any workset\n6.Modify workset by rules (Option to have rules for workset seperation and then directly filter families which are required and update workset for those families as well)","1.Familiy revisior do not give any option to edit system families name.","Unpaid","\"Tutorial video - \nhttps://www.youtube.com/watch?v=p-kz5_zfcls",null,"Faizan","Done","https://www.dropbox.com/work/Arnav%20Jain/Training%20Calendar-2023/Automation%20repository-Faizan/Testing%20Projects/%23Add-ins/DiRoots%20-%20FamilyReviser",null,"Techture drive link -\nhttps://www.dropbox.com/work/Arnav%20Jain/Training%20Calendar-2023/Automation%20repository-Faizan/Add-in%20Setups\n\nOfficial website link-\nhttps://apps.autodesk.com/RVT/en/Detail/Index?id=6035794126247149351&appLang=en&os=Win64","NA","Sheets and Models","Implement"],[3,"DiRootsOne - 8 Productivity Tools\n\n3).DiRoots - One Filter","ARC,STR,MEP,Civil 3D","Quickly find your families in Revit models. Search by category, parameter name, and value. Find elements within Areas, Masses, Rooms, Spaces, and Zones.\nColorize elements based on the values of their parameters.","Main Features:\n1.Find Revit Families by Categories.\n2.Find Revit Families by Parameter Name.\n3.Find Revit Families by Parameter Value.\n4.Find Revit elements inside Rooms, Spaces, Areas, etc.\n5.Isolate custom revit families and save as a selection and a 3D view also\n5.Colorize Revit elements by parameter value.","1.we cant colourize  spaces, hvac zones, site, categories.","Unpaid","\"Overview video - \nhttps://www.youtube.com/watch?v=Bp-Nh1MM3tk\"\n\n\nTutorial video - \nhttps://www.youtube.com/watch?v=x7ii0F5r-jk\n\nhttps://www.youtube.com/watch?v=p3nIl45V4mY\"\n\nhttps://www.youtube.com/watch?v=Oo797onW0-w\"",null,"Faizan","Done","https://www.dropbox.com/work/Arnav%20Jain/Training%20Calendar-2023/Automation%20repository-Faizan/Testing%20Projects/%23Add-ins/DiRoots%20-%20OneFilter",null,"Techture drive link -\nhttps://www.dropbox.com/work/Arnav%20Jain/Training%20Calendar-2023/Automation%20repository-Faizan/Add-in%20Setups\n\nOfficial website link-\nhttps://apps.autodesk.com/RVT/en/Detail/Index?id=6035794126247149351&appLang=en&os=Win64","NA","Sheets and Models","Implement"],[4,"DiRootsOne - 8 Productivity Tools\n\n4).DiRoots - TableGen","ARC,STR,MEP,Civil 3D","Import your spreadsheets into Revit as Legend Views, Schedule Views and Drafting Views. Collaborate with non-Revit users and bring the beauty of your Excel Tables into Revit.","Main Features:\n1.Import Excel tables to Revit as Drafting, Legend, and Schedule Views.\n2.Import Excel charts to Revit.\n3.Bring the images in your Excel tables to Revit.\n4.Keep your Views automatically synchrozined with your Excel file using 'AutoSync' feature","1.Edit option available for table those only created by this method\n2.we have to Adjust text size after import","Unpaid","\"Overview video - \nhttps://youtu.be/kb5AarUezO4\"\n\n\nTutorial video - \nhttps://www.youtube.com/watch?v=JHIGOxUtd2g\n",null,"Faizan","Done","https://www.dropbox.com/work/Arnav%20Jain/Training%20Calendar-2023/Automation%20repository-Faizan/Testing%20Projects/%23Add-ins/DiRoots%20-%20TableGen",null,"Techture drive link -\nhttps://www.dropbox.com/work/Arnav%20Jain/Training%20Calendar-2023/Automation%20repository-Faizan/Add-in%20Setups\n\nOfficial website link-\nhttps://apps.autodesk.com/RVT/en/Detail/Index?id=6035794126247149351&appLang=en&os=Win64","NA","Sheets and Models","Implement"],[5,"DiRootsOne - 8 Productivity Tools\n\n5).DiRoots - SheetGen","ARC,STR,MEP,Civil 3D","Create multiple Drawing Sheets, place Views based on a pre-defined template, and easily manage Drawing Sheets revisions. Export sheets/views lists to/from Excel.\n","It can create batch revit sheets, place views on sheets based on a pre-defined template, and easily manage Sheet Revisions.\n\nMain Features:\n1.Batch create Revit Sheets\n2.Place Views on Sheets based on a predefined template\n3.Easily manage Sheet Revisions","1.If we are generating new sheets with new views , we have to make sure the view is with in the sheet. we have to check the scale.\n2.we can only assign the revision. we can't do any modification to revisions with in the sheetgen.\n3.in version 1.5.0.0 view manager, there is issue with export and importing option. renaming the bulk views from excel gointg to be a problem. its a bug i guess.\n Because of the above issue we have to feed the data to the parameters manulaly in diroots.this is also a limitaion. \n","Unpaid","Overview video - \nhttps://youtu.be/DBKRGG9VRLQ\n\n\nTutorial video -\nhttps://www.youtube.com/watch?v=lyOEKtZwEvo\n\nhttps://www.youtube.com/watch?v=I4YCvegZqhA",null,"Faizan","Done","https://www.dropbox.com/work/Arnav%20Jain/Training%20Calendar-2023/Automation%20repository-Faizan/Testing%20Projects/%23Add-ins/DiRoots%20-%20SheetLink","La- Reserve","Techture drive link -\nhttps://www.dropbox.com/work/Arnav%20Jain/Training%20Calendar-2023/Automation%20repository-Faizan/Add-in%20Setups\n\nOfficial website link-\nhttps://apps.autodesk.com/RVT/en/Detail/Index?id=6035794126247149351&appLang=en&os=Win64","NA","Sheets and Models","Implement"],[6,"DiRootsOne - 8 Productivity Tools\n\n6).DiRoots - ReOrdering","ARC,STR,MEP,Civil 3D","Easily renumber instance Revit parameters by using a prefix, a suffix, and a multiplier (manually or following a path/detail line).\n","Main Features:\n1.Quickly filter elements by category, family type, and instance parameters\n2.Renumber instance parameters by using a prefix, a suffix, and a multiplier\n3.Renumber randomly all elements at once\n4.Renumber following a path/detail line (crossing or vector)\n5.Temporary highlight selected elements in Order Manually mode\n6.Alternatively, export the data to Excel and import it back","Renumbering Different floor element according proper mannar bit time consuming","Unpaid","Tutorial video - \nhttps://www.youtube.com/watch?v=6BQzPqShnTY\n\n\nhttps://www.youtube.com/watch?v=SCRu_SDrep0",null,"Faizan","Done","https://www.dropbox.com/work/Arnav%20Jain/Training%20Calendar-2023/Automation%20repository-Faizan/Testing%20Projects/%23Add-ins/DiRoots%20-%20ReOrdering",null,"Techture drive link -\nhttps://www.dropbox.com/work/Arnav%20Jain/Training%20Calendar-2023/Automation%20repository-Faizan/Add-in%20Setups\n\nOfficial website link-\nhttps://apps.autodesk.com/RVT/en/Detail/Index?id=6035794126247149351&appLang=en&os=Win64","NA","Sheets and Models","Implement"],[7,"DiRootsOne - 8 Productivity Tools\n\n7).ParaManager","ARC,STR,MEP,Civil 3D","Manage Revit parameters inside project and the point cloud to XYZ, PTS, or DXF files and open it in a Revit family environment (RFA).\n4.Define point cloud density while exporting.\n5.Re-mesh exported points and save them to a DXF file",null,"Unpaid","Overview video - \nhttps://youtu.be/0ZbAaSCKbLE",null,"Faizan","Done","https://www.dropbox.com/work/Arnav%20Jain/Training%20Calendar-2023/Automation%20repository-Faizan/Testing%20Projects/%23Add-ins/DiRoots%20-%20PointKit",null,"Techture drive link -\nhttps://www.dropbox.com/work/Arnav%20Jain/Training%20Calendar-2023/Automation%20repository-Faizan/Add-in%20Setups\n\nOfficial website link-\nhttps://apps.autodesk.com/RVT/en/Detail/Index?id=6035794126247149351&appLang=en&os=Win64","NA","Sheets and Models","Implement"],[9,"DiRoots Pro Sheets","ARC,STR,MEP,Civil 3D","ProSheets helps to batch export Views and Sheets to PDF, DWG, DGN, DWF, NWC, IFC, and Images (JPEG, PNG, TIFF, etc).","Main Features:\n1.Export with a customized filename convention that complies with the deliverables standards.\nE.g., [Sheet Name]-[Sheet Number].pdf\n2.Save a sheet/view sets to export as per setwise",null,"Unpaid","\"Tutorial video - \n\nhttps://www.youtube.com/watch?v=WBp7NR5tw_g",null,"Faizan","Done","https://www.dropbox.com/work/Arnav%20Jain/Training%20Calendar-2023/Automation%20repository-Faizan/Testing%20Projects/%23Add-ins/DiRoots%20-%20ProSheet",null,"Techture drive link -\nhttps://www.dropbox.com/work/Arnav%20Jain/Training%20Calendar-2023/Automation%20repository-Faizan/Add-in%20Setups\n\nOfficial Website link -\nhttps://apps.autodesk.com/RVT/en/Detail/Index?id=7448218013676619378&appLang=en&os=Win64&autostart=true","NA","Sheets and Models","Implement"],[10,"DiStellar","ARC,STR,MEP","F","Free open source IFC viewer to manage BIM models.\nIt has different features like section planes, floor plans, measure, snapshot, isolate highlight,etc",null,"Unpaid","Overview video - \nhttps://www.youtube.com/watch?v=e-q0AJQRacY&pp=ygUJZGlzdGVsbGFy\n\nTutorial video -\nhttps://www.youtube.com/watch?v=YquTvG3WuSI&pp=ygUJZGlzdGVsbGFy",null,"Faizan","Done","Web-Based samples available on logins only",null,"https://distellar.diroots.com/","NA","IFC Viewer","Hold"],[11,"BlocksBIM\n⭐","ARC&STR","Download almost all types of revit families(parameteric & non-paramertic) from their own cloud based library and directly place them inside revit files","Main Features:\n-Quick click and place families, download size is minimal\n-Place families for hosted and non-hosted families\n-Materials are inbuilt in all families\n",null,"Paid","Tutorial video -\nhttps://www.youtube.com/watch?v=QpTHxg42N_0",null,"Faizan","Done","https://www.dropbox.com/work/Arnav%20Jain/Training%20Calendar-2023/Automation%20repository-Faizan/Testing%20Projects/%23Add-ins/BlocksBIM",null,"Techture drive link -\nhttps://www.dropbox.com/work/Arnav%20Jain/Training%20Calendar-2023/Automation%20repository-Faizan/Add-in%20Setups\n\nOfficial Website link -\nhttps://www.blocksrvt.com/en/download","Trial version \n-Limited access to Plug-in Blocks families \n-Parametric families with textures set to render\n\nPremium version (EUR 9.99/Month) -\n-Full access to all Plugin families\n-Over 4,000 families available immediately\n-Parametric families with textures set to render\nLaunch of 25 exclusive families every week\n-Launch of 25 exclusive families every week",null,"Archieve"],[12,"Ideate BIM Software Bundle\n\n1). Ideate BIMLink","ARC,STR,MEP,Civil 3D","Pull information from a Revit file into Excel and send it back into your Revit project with ease","Main Features:\n1.Create sheets in revit from excel data\n2.Create/edit family paramters , create schedules,sheet list etc.\n3.Rename families using excel sheets\n4.Create,edit, manage revisions in revit",null,"Paid","https://www.youtube.com/watch?v=wVHYyIdEpHY",null,"Faizan","Done","https://www.dropbox.com/work/Arnav%20Jain/Training%20Calendar-2023/Automation%20repository-Faizan/Testing%20Projects/%23Add-ins/Ideate%20BIMLinks",null,"Techture drive link -\nhttps://www.dropbox.com/work/Arnav%20Jain/Training%20Calendar-2023/Automation%20repository-Faizan/Add-in%20Setups/Ideate%20Software%20Bundle\n\nOfficial Website link -\nhttps://ideatesoftware.com/download-revit-plugins\n\n\nRemarks:\nDownload the Ideate Bundle which includes all the 5 types of addins or download individual addins as per the requirement","Trial version \n-30Days with some features available\n\nPremium version -\n-6-month single-user stand-alone bundle promotion priced at US$500  \n-6-month multi-user cloud network bundle available for US$995\n-6-month multi-user cloud network bundle + Ideate Automation for US$1995"],[13,"Ideate BIM Software Bundle\n\n2). Ideate Explorer","ARC,STR,MEP,Civil 3D","Manage Revit file health, make changes to your BIM data quickly, and maintain models with precision.","Main Features:\n1.Sorts project browser \n2.Option to change different types of detail lines and model lines in entire project all at once\n3.Ideate Query - it is search engine inside addin to search any issues with adding rules and filters\n4.Sorted Warning Dialogue - helps to isolate 2warnings, set ranking of warings",null,"Paid","https://www.youtube.com/watch?v=ytfB_NkD8rM&t=241s",null,"Faizan","Done","https://www.dropbox.com/work/Arnav%20Jain/Training%20Calendar-2023/Automation%20repository-Faizan/Testing%20Projects/%23Add-ins/Ideate%20Explorer"],[14,"Ideate BIM Software Bundle\n\n3). Ideate Sticky","ARC,STR,MEP","Connect non-BIM data from an Excel file into your Revit project with the convenience of a sticky note.","Main Features:\n1.Import Spreadsheet data as schedule, images, schedule graphics into revit sheets (editable data)\n2.Auto sync feature to update data(absolute or relative path)\n3.Useful for Legends, Code blocks, sheetlist, Drafting views, Graphical columns, 2D data to represent in sheets",null,"Paid","https://www.youtube.com/watch?v=-yLmvuqHEtU",null,"Faizan","Done","https://www.dropbox.com/work/Arnav%20Jain/Training%20Calendar-2023/Automation%20repository-Faizan/Testing%20Projects/%23Add-ins/Idaete%20Sticky"],[15,"Ideate BIM Software Bundle\n\n4). Ideate StyleManager","ARC,STR,MEP","\nThe trial version allows users to experience the analyze, rename, merge and delete functionality of Ideate StyleManager within the Line Patterns, Materials and Material Appearance Asset styles.\nAccess to Object Styles, Lines Styles, Fill Regions and Fill Patterns, Filters, View Templates, Viewports, Scope Boxes, Text and Fonts, Dimensions and Arrowheads is enabled with a paid subscription.","Main Features:\n1.It helps analyse the risk of deleting elements like lines, model objects, line patterns,etc and their relation to other views & sheets\n2.Prioritise and safely delete elements like imported categories without affecting sheets and other relevant sources like without messing final prints",null,"Paid","https://www.youtube.com/watch?v=LPSyLf1j498",null,"Faizan","Done","https://www.dropbox.com/work/Arnav%20Jain/Training%20Calendar-2023/Automation%20repository-Faizan/Testing%20Projects/%23Add-ins/Ideate%20StyleManager"],[16,"Ideate BIM Software Bundle\n\n5). Ideate Apps","ARC,STR,MEP,Civil 3D","Simplify the Revit tasks that daily users perform most often, reduce accidental deletions, and facilitate problem-solving.","Main Apps:\n1.Ideate ReNumber = It is similar as DiRoots - ReOrdering\n(Renumber following a detail line (auto,manual,crossing,vector)\n2.Ideate QuickSelect = It is similar to search engine in project brower with view options like(search in active view, entire view,current slection)\n3.Ideate SmartDelete = Get second chance to review before deletion of any element. Preview what else can be deleted before it happens\n4.Ideate Xray = It provides 50 reasons why elements may be hidden in a view, helps to fix the hidden elements issues\n5.Ideate SpellCheck = Spell check in any view,sheet,3d,schedules\n6.Ideate SheetManager = It helps to find out specific views simply search the name regardless of the sheet/views groups\n7.Ideate Align = It aligns views on sheets as per using model coordinates\n8.Ideate Clone = Duplicates sheets with views option selection, alignment selection but only one duplication at a time\n9.Ideate Creator = Batch creates revit views, view name and view property settings ",null,"Paid","https://www.youtube.com/watch?v=Rbbl7fhWEMo",null,"Faizan","Done","https://www.dropbox.com/work/Arnav%20Jain/Training%20Calendar-2023/Automation%20repository-Faizan/Testing%20Projects/%23Add-ins/Ideate%20Apps"],[17," Ideate Automation","ARC,STR,MEP","Claims to reduce repetitive BIM task","It can export data and import data from excel and do the task inside revit without actually opening revit just by asigning task in Task scheduler and writing the task using scripts inside Ideate Automation software",null,"Paid","Overview video -\n\nhttps://www.youtube.com/watch?v=rKg_HxM5AnY",null,"Faizan","Pending","To test this software, it requires licensed version and scripts"],[18,"Sheet Creator","ARC,STR,MEP,Civil 3D",null,"This add-in will help you to select your desired views in Revit file and to create sheet for them simultaneously.\n\nBy this app You can set the title block used in sheet, sheet number, and sheet name, in one form and multiple sheets will be created from selected views",null,"Paid","Help Documentation -\nhttps://apps.autodesk.com/RVT/en/Detail/HelpDoc?appId=1387531060484262030&appLang=en&os=Win64",null,"Faizan",null,null,null,"Techture drive link -\nhttps://www.dropbox.com/work/Arnav%20Jain/Training%20Calendar-2023/Automation%20repository-Faizan/Add-in%20Setups\n\n\nOfficial Website link -\nhttps://apps.autodesk.com/RVT/en/Detail/Index?id=1387531060484262030&appLang=en&os=Win64","Trial version \n-You can create sheet for only 3 views\n\nPremium version (/Month) -\n"],[19,"Rushforth","ARC,STR,MEP","This addin is used for multiple purpose like Project setup, Model manager/Parameter Transformer, Parameter Schedule, Parameter lnker, 3D sections, different exports, di <script>
/* ===== Pure data model: turns raw sheet rows into typed collections. No DOM here. ===== */
const T = v => (v == null ? '' : String(v)).replace(/\r/g, '').trim();
const norm = v => T(v).toLowerCase().replace(/\s+/g, ' ');
const slugify = t => T(t).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'x';
const isUrl = s => /^https?:\/\//i.test(s);

function findCols(headers, spec) {
  const used = new Set(), out = {};
  const h = headers.map(norm);
  for (const [key, res] of Object.entries(spec)) {
    out[key] = -1;
    for (const re of res) {
      const i = h.findIndex((x, k) => !used.has(k) && re.test(x));
      if (i >= 0) { out[key] = i; used.add(i); break; }
    }
  }
  out._used = used;
  return out;
}
const cell = (r, i) => (i >= 0 && i < r.length ? r[i] : null);

function detectKind(sheet) {
  const hdr = (sheet.rows[0] || []).map(norm).join(' | ');
  if (/project/.test(hdr) && /(issue|topic)/.test(hdr) && /(solution|resolution)/.test(hdr)) return 'projects';
  if (/(software|add-?in|plugin)/.test(hdr) && /(purpose|description)/.test(hdr) && /(paid|testing|conclusion)/.test(hdr)) return 'plugins';
  if (/topic/.test(hdr) && /link/.test(hdr)) return 'training';
  return 'generic';
}

/* ---------- people, disciplines, dates ---------- */
const splitDisc = s => T(s).split(/\s*(?:,|&|\+|\/|\band\b)\s*/i).map(x => x.trim()).filter(Boolean)
  .map(x => (/^(arc|str|mep|mepf)$/i.test(x) ? x.toUpperCase() : x));
const splitPeople = s => T(s).split(/\s*(?:&|,|\+|\/|\band\b)\s*/i).map(x => x.trim().replace(/\s+/g, ' '))
  .filter(x => x && !/^(team|na|n\/a|-)$/i.test(x))
  .map(x => x.charAt(0).toUpperCase() + x.slice(1));
function parseDate(v) {
  const s = T(v);
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  return null;
}
const quarterOf = d => (d ? `Q${Math.floor((+d.slice(5, 7) - 1) / 3) + 1} ${d.slice(0, 4)}` : null);
const qSort = q => (q ? +q.slice(3) * 4 + +q[1] : 0);

/* ---------- plugins ---------- */
function parsePlugins(sheet) {
  const [head, ...body] = sheet.rows;
  const c = findCols(head, {
    id: [/^(bi|s\.? ?no|sr\.? ?no|#|id)$/],
    name: [/(software|add-?in|plugin|tool).*name/, /^name$/],
    disc: [/discipline/], purpose: [/purpose/], desc: [/^description/], lim: [/limitation/],
    paid: [/paid|cost|licen[cs]e/], video: [/(step by step|training|video|tutorial)/],
    ver: [/version/], owner: [/(responsible|owner|assigned)/],
    test: [/testing status/, /^status$/], testLink: [/testing.*(link|project)/],
    impl: [/implemented/], dl: [/download/], price: [/(trial|price)/], cat: [/category/], concl: [/(conclusion|decision)/],
  });
  const items = []; let orphan = 0, merged = 0;
  for (const r of body) {
    const name = T(cell(r, c.name));
    if (!name) {
      const text = [cell(r, c.desc), cell(r, c.purpose)].map(T).filter(Boolean).join('\n');
      const vid = T(cell(r, c.video));
      const last = items[items.length - 1];
      if (last && (text || vid)) {
        if (text) last.notes.push(text);
        if (vid) last.video = last.video ? last.video + '\n' + vid : vid;
        merged++;
      } else orphan++;
      continue;
    }
    const lines = name.split('\n').map(x => x.trim()).filter(Boolean);
    let suite = '', title = lines.join(' ');
    const numbered = lines.findIndex((l, i) => i > 0 && /^\d+\)\.?\s*\S/.test(l));
    if (numbered > 0) {
      suite = lines.slice(0, numbered).join(' ').replace(/\s*[-–:]\s*$/, '');
      title = lines.slice(numbered).join(' ').replace(/^\d+\)\.?\s*/, '');
    }
    const starred = /⭐|★/.test(title);
    title = title.replace(/⭐|★/g, '').replace(/\s+/g, ' ').trim();
    const paidRaw = T(cell(r, c.paid));
    const paid = /unpaid|free/i.test(paidRaw) ? 'Unpaid' : /trial|\bdays?\b/i.test(paidRaw) ? 'Trial' : /paid/i.test(paidRaw) ? 'Paid' : (paidRaw ? 'Other' : '');
    const testRaw = T(cell(r, c.test));
    const test = /done|complete/i.test(testRaw) ? 'Done' : /pend/i.test(testRaw) ? 'Pending' : /prog/i.test(testRaw) ? 'In progress' : testRaw;
    const conRaw = T(cell(r, c.concl));
    const concl = /^impl/i.test(conRaw) ? 'Implement' : /^hold/i.test(conRaw) ? 'Hold' : /^arch/i.test(conRaw) ? 'Archive' : conRaw;
    items.push({
      kind: 'plugin', idx: items.length, num: T(cell(r, c.id)), title, suite, starred, name,
      disc: splitDisc(cell(r, c.disc)), discRaw: T(cell(r, c.disc)),
      purpose: T(cell(r, c.purpose)), desc: T(cell(r, c.desc)), lim: T(cell(r, c.lim)),
      paid, paidRaw, video: T(cell(r, c.video)), ver: T(cell(r, c.ver)), owner: T(cell(r, c.owner)),
      test, testLink: T(cell(r, c.testLink)), impl: T(cell(r, c.impl)), dl: T(cell(r, c.dl)),
      price: T(cell(r, c.price)), cat: T(cell(r, c.cat)), concl, notes: [],
    });
  }
  return { items, orphan, merged };
}

/* ---------- live project implementations ---------- */
function parseProjects(sheet) {
  const [head, ...body] = sheet.rows;
  const c = findCols(head, {
    id: [/^(s\.? ?no|sr\.? ?no|#|id)/], project: [/project/], topic: [/(issue|topic)/], desc: [/^description/],
    disc: [/discipline/], cat: [/category/], sol: [/solution/], res: [/resolution/], ben: [/benefit/],
    month: [/(month|date|quarter)/], by: [/(implemented|by|owner)/],
  });
  const items = []; let blank = 0;
  const noteCol = head.length;
  for (const r of body) {
    const topic = T(cell(r, c.topic)), desc = T(cell(r, c.desc)), res = T(cell(r, c.res));
    if (!topic && !desc && !res) { blank++; continue; }
    const date = parseDate(cell(r, c.month));
    const extra = r.slice(Math.max(...[...c._used].filter(i => i >= 0), 0) + 1).map(T).filter(Boolean).join('\n');
    items.push({
      kind: 'impl', idx: items.length, num: T(cell(r, c.id)), project: T(cell(r, c.project)) || 'Unassigned',
      topic: topic || '(untitled request)', desc, disc: T(cell(r, c.disc)) || 'Unspecified', cat: T(cell(r, c.cat)) || 'Unspecified',
      sol: T(cell(r, c.sol)) || 'Unspecified', res, ben: T(cell(r, c.ben)), date, dateRaw: T(cell(r, c.month)),
      quarter: quarterOf(date), year: date ? date.slice(0, 4) : null,
      byRaw: T(cell(r, c.by)), by: splitPeople(cell(r, c.by)), extra,
    });
  }
  return { items, blank };
}

/* ---------- training (two tables can sit side by side) ---------- */
function parseTraining(sheet) {
  const [head, ...body] = sheet.rows;
  const h = head.map(norm);
  const starts = [];
  h.forEach((x, i) => { if (/^(sr|s)\.? ?no/.test(x)) starts.push(i); });
  if (!starts.length) starts.push(0);
  const blocks = starts.map((s, k) => ({ from: s, to: k + 1 < starts.length ? starts[k + 1] : head.length }));
  const out = { available: [], external: [], missing: [], other: [] };
  blocks.forEach((b, k) => {
    const cols = findCols(head.slice(b.from, b.to), {
      num: [/^(sr|s)\.? ?no/], title: [/topic/], desc: [/description/], link: [/link/], remarks: [/remark/], target: [/(target|timeline)/],
    });
    let section = k === 0 ? 'available' : 'missing';
    const isMissing = /missing/.test(h.slice(b.from, b.to).join(' '));
    section = isMissing ? 'missing' : 'available';
    for (const r of body) {
      const seg = r.slice(b.from, b.to);
      const title = T(cell(seg, cols.title)).replace(/\s*\n\s*/g, ' ');
      const num = T(cell(seg, cols.num));
      const others = seg.filter((v, i) => i !== cols.title && T(v)).length;
      if (!isMissing && !title) {
        const lone = T(cell(seg, cols.num));
        if (lone && !/^\d+$/.test(lone) && !seg.some((v, i) => i !== cols.num && T(v))) { section = /external/i.test(lone) ? 'external' : 'available'; }
        continue;
      }
      if (!isMissing && title && !others) { section = /external/i.test(title) ? 'external' : 'available'; continue; }
      if (!title) continue;
      const tgt = cell(seg, cols.target);
      out[isMissing ? 'missing' : section].push({
        kind: 'train', section: isMissing ? 'missing' : section, num, title, desc: T(cell(seg, cols.desc)),
        link: T(cell(seg, cols.link)), remarks: T(cell(seg, cols.remarks)), target: T(tgt),
      });
    }
    // a target timeline listed once applies to the whole missing list
  });
  if (out.missing.length) {
    const t = out.missing.find(x => x.target);
    if (t) out.missing.forEach(x => { if (!x.target) x.target = t.target; });
  }
  return out;
}

/* ---------- generic sheet ---------- */
function parseGeneric(sheet, index) {
  const [head, ...body] = sheet.rows;
  const cols = head.map((x, i) => T(x) || `Column ${i + 1}`);
  const width = Math.max(cols.length, ...body.map(r => r.length), 0);
  while (cols.length < width) cols.push(`Column ${cols.length + 1}`);
  let titleCol = 0, best = -1;
  for (let i = 0; i < width; i++) {
    const vals = body.map(r => T(r[i])).filter(Boolean);
    if (!vals.length) continue;
    const textShare = vals.filter(v => /[A-Za-z]/.test(v) && !isUrl(v)).length / vals.length;
    const uniq = new Set(vals).size / vals.length;
    const score = textShare * 2 + uniq + (i === 0 ? 0.05 : 0) + Math.min(vals.length / body.length, 1);
    if (score > best) { best = score; titleCol = i; }
  }
  const rows = body.map((r, k) => ({
    kind: 'row', idx: k, sheet: index,
    title: T(r[titleCol]).split('\n')[0] || `Row ${k + 2}`,
    values: cols.map((_, i) => T(r[i])),
  })).filter(r => r.values.some(Boolean));
  return { cols, titleCol, rows };
}

/* ---------- whole workbook ---------- */
function buildModel(raw) {
  const m = { file: raw.file || 'Workbook', plugins: [], impls: [], training: { available: [], external: [], missing: [] }, generic: [], sheets: [], notes: [] };
  (raw.sheets || []).forEach((sheet, si) => {
    if (!sheet.rows || sheet.rows.length < 2) { m.sheets.push({ name: sheet.name, kind: 'empty', rows: 0, note: 'No data rows' }); return; }
    const kind = detectKind(sheet);
    if (kind === 'plugins') {
      const p = parsePlugins(sheet);
      m.plugins = m.plugins.concat(p.items);
      m.sheets.push({ name: sheet.name, kind, label: 'Add-ins and tools', rows: p.items.length,
        note: [p.merged && `${p.merged} feature rows without a name were attached to the add-in above them`, p.orphan && `${p.orphan} rows skipped (no name)`].filter(Boolean).join('; ') });
    } else if (kind === 'projects') {
      const p = parseProjects(sheet);
      p.items.forEach(x => { x.idx = m.impls.length; m.impls.push(x); });
      m.sheets.push({ name: sheet.name, kind, label: 'Live project automations', rows: p.items.length,
        note: p.blank ? `${p.blank} numbered rows with no content skipped` : '' });
    } else if (kind === 'training') {
      const t = parseTraining(sheet);
      ['available', 'external', 'missing'].forEach(k => { m.training[k] = m.training[k].concat(t[k]); });
      m.sheets.push({ name: sheet.name, kind, label: 'Training resources', rows: t.available.length + t.external.length + t.missing.length, note: '' });
    } else {
      const g = parseGeneric(sheet, m.generic.length);
      m.generic.push({ name: sheet.name, ...g });
      m.sheets.push({ name: sheet.name, kind: 'generic', label: 'Other table', rows: g.rows.length, note: 'Shown as a plain table' });
    }
  });
  // projects
  const pm = new Map();
  m.impls.forEach(x => {
    const key = slugify(x.project);
    if (!pm.has(key)) pm.set(key, { slug: key, name: x.project, items: [] });
    pm.get(key).items.push(x);
  });
  m.projects = [...pm.values()].map(p => {
    const dates = p.items.map(x => x.date).filter(Boolean).sort();
    return { ...p, count: p.items.length, first: dates[0] || null, last: dates[dates.length - 1] || null,
      sols: countBy(p.items, x => [x.sol]) };
  }).sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
  m.projBySlug = Object.fromEntries(m.projects.map(p => [p.slug, p]));
  m.quarters = (() => {
    const qs = [...new Set(m.impls.map(x => x.quarter).filter(Boolean))].sort((a, b) => qSort(a) - qSort(b));
    if (!qs.length) return [];
    const out = []; let [q, y] = [+qs[0][1], +qs[0].slice(3)];
    const end = qSort(qs[qs.length - 1]);
    while (y * 4 + q <= end) { out.push(`Q${q} ${y}`); q++; if (q > 4) { q = 1; y++; } }
    return out;
  })();
  return m;
}
function countBy(items, fn) {
  const c = new Map();
  items.forEach(it => fn(it).forEach(k => { if (k) c.set(k, (c.get(k) || 0) + 1); }));
  return [...c.entries()].map(([label, value]) => ({ label, value })).sort((a, b) => b.value - a.value || a.label.localeCompare(b.label));
}
function diffModels(a, b) {
  const keys = (m) => ({
    plugins: new Map(m.plugins.map(x => [norm(x.title), x.title])),
    impls: new Map(m.impls.map(x => [norm(x.project + '|' + x.topic + '|' + (x.date || '')), x.topic])),
    training: new Map([...m.training.available, ...m.training.external, ...m.training.missing].map(x => [norm(x.section + x.title), x.title])),
  });
  const A = keys(a), B = keys(b), out = [];
  const labels = { plugins: 'Add-ins', impls: 'Automations', training: 'Training items' };
  for (const k of Object.keys(labels)) {
    const added = [...B[k]].filter(([key]) => !A[k].has(key)).map(x => x[1]);
    const removed = [...A[k]].filter(([key]) => !B[k].has(key)).map(x => x[1]);
    out.push({ label: labels[k], before: A[k].size, after: B[k].size, added, removed });
  }
  return out;
}
if (typeof module !== 'undefined') module.exports = { buildModel, diffModels, parsePlugins, parseProjects, parseTraining };

</script>
<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const attr = s => esc(s).replace(/"/g,'&quot;');
const plural = (n,a,b) => n===1?a:(b||a+'s');
const fmtDate = d => { if(!d) return ''; const [y,m,dd]=d.split('-'); return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]+' '+(+dd)+', '+y; };
const STORE='automation-library:data', THEME='automation-library:theme';

/* ---------- state ---------- */
let RAW = BUNDLED, SRC = {file:BUNDLED.file, at:null, bundled:true, saved:false}, M, INDEX=[], LAST_DIFF=null, UP_ERR='';
const F = {plugins:{q:'',paid:'',test:'',concl:'',disc:''}, impl:{q:'',disc:'',cat:'',sol:'',quarter:'',project:'',by:'',limit:80}, projects:{q:''}, gen:{}};
try{
  const s = JSON.parse(localStorage.getItem(STORE)||'null');
  if(s && s.sheets && s.sheets.length){ RAW={file:s.file,sheets:s.sheets}; SRC={file:s.file,at:s.at,bundled:false,saved:true}; }
}catch(e){}
try{ M = buildModel(RAW); }catch(e){ RAW=BUNDLED; SRC={file:BUNDLED.file,at:null,bundled:true,saved:false}; M=buildModel(RAW); }

/* ---------- text helpers ---------- */
const URL_RE = /(https?:\/\/[^\s<>"']+)/g;
function cleanUrl(u){ return u.replace(/[)\].,;:!?]+$/,''); }
function hostLabel(u){
  let h=''; try{ h=new URL(u).hostname.replace(/^www\./,''); }catch(e){ return 'Link'; }
  if(/youtu\.?be/.test(h)) return 'YouTube'; if(/dropbox/.test(h)) return 'Dropbox'; if(/apps\.autodesk/.test(h)) return 'Autodesk App Store';
  if(/github/.test(h)) return 'GitHub'; if(/drive\.google|docs\.google/.test(h)) return 'Google Drive'; if(/forms\./.test(h)) return 'Form';
  if(/dynamobim|dynamo/.test(h)) return 'Dynamo site'; return h;
}
function short(u){ try{ const x=new URL(u); const p=x.pathname.length>1?x.pathname:''; const s=x.hostname.replace(/^www\./,'')+p; return s.length>54?s.slice(0,52)+'…':s; }catch(e){ return u; } }
function linkify(t){
  return String(t==null?'':t).split(URL_RE).map((p,i)=>{
    if(i%2===0) return esc(p);
    const u=cleanUrl(p), tail=p.slice(u.length);
    return `<a href="${attr(u)}" target="_blank" rel="noopener noreferrer">${esc(short(u))}</a>${esc(tail)}`;
  }).join('');
}
function urls(t){ const out=[]; (String(t||'').match(URL_RE)||[]).forEach(u=>{u=cleanUrl(u); if(!out.includes(u)) out.push(u);}); return out; }
function linkChips(t){ const u=urls(t); return u.length?`<div class="lks">${u.map(x=>`<a class="lk" href="${attr(x)}" target="_blank" rel="noopener noreferrer">${esc(hostLabel(x))}</a>`).join('')}</div>`:''; }
function textBlock(title, t, opts){
  t=T(t); if(!t) return '';
  return (title?`<h2>${esc(title)}</h2>`:'')+`<div class="txt">${linkify(t)}</div>`;
}
function linkSection(title,t){
  t=T(t); if(!t) return '';
  const u=urls(t);
  return `<h2>${esc(title)}</h2>${linkChips(t)}${(u.length&&t.replace(URL_RE,'').replace(/[\s\-–:"']+/g,'').length<3)?'':`<details class="raw"${u.length?'':' open'}><summary>${u.length?'Original text':'Details'}</summary><div class="txt">${linkify(t)}</div></details>`}`;
}
const crumbs = parts => '<div class="crumb">'+parts.map((p,i)=>(i?'<span>›</span>':'')+(p.go?`<a href="#${p.go}" data-go="${p.go}">${esc(p.t)}</a>`:`<span>${esc(p.t)}</span>`)).join('')+'</div>';
const toneFor = {paid:{Unpaid:'ok',Paid:'',Trial:'warn',Other:''}, test:{Done:'ok',Pending:'warn','In progress':'acc'}, concl:{Implement:'ok',Hold:'warn',Archive:'bad'}};
const bdg = (t,tone) => t?`<span class="bdg ${tone||''}">${esc(t)}</span>`:'';
const pickN = (n,list) => list.slice(0,n);

/* ---------- facet options ---------- */
function opts(items, fn){ return countBy(items, fn); }
function select(id,label,list,val,key){
  return `<label class="fld"><span>${esc(label)}</span><select data-k="${key}" id="${id}"><option value="">All</option>${list.map(o=>`<option value="${attr(o.label)}"${o.label===val?' selected':''}>${esc(o.label)} (${o.value})</option>`).join('')}</select></label>`;
}

/* ---------- charts ---------- */
function rankBars(list, kind, key, max){
  if(!list.length) return '<div class="empty">No data yet.</div>';
  const m = Math.max(...list.map(x=>x.value));
  return `<div class="rb">${list.slice(0,max||8).map(x=>`<button data-open="${kind}" data-key="${key}" data-val="${attr(x.label)}" title="${attr(x.label)}: ${x.value}"><span class="l">${esc(x.label)}</span><span class="tr"><span class="f" style="width:${Math.max(2,x.value/m*100)}%"></span></span><span class="v">${x.value}</span></button>`).join('')}</div>`;
}
function niceMax(v){ const p=Math.pow(10,Math.floor(Math.log10(Math.max(v,1)))); const n=v/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }
function quarterChart(){
  const qs = M.quarters; if(!qs.length) return '<div class="empty">No dated automations yet.</div>';
  const counts = qs.map(q=>M.impls.filter(x=>x.quarter===q).length);
  const W=640,H=240,L=38,R=10,Tp=20,B=34, iw=W-L-R, ih=H-Tp-B;
  const top=niceMax(Math.max(...counts)), bw=iw/qs.length;
  let g='';
  for(let i=0;i<=4;i++){ const v=top/4*i, y=Tp+ih-ih*(v/top); g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${Math.round(v)}</text>`; }
  qs.forEach((q,i)=>{
    const n=counts[i], x=L+i*bw+bw*.17, w=bw*.66, hh=ih*(n/top), y=Tp+ih-hh, r=Math.min(4,w/2,hh);
    if(n>0) g+=`<path class="bar" data-open="impl" data-key="quarter" data-val="${q}" data-tip="${q}: ${n} ${plural(n,'automation')}" d="M${x},${Tp+ih} V${y+r} Q${x},${y} ${x+r},${y} H${x+w-r} Q${x+w},${y} ${x+w},${y+r} V${Tp+ih} Z"><title>${q}: ${n}</title></path><text class="val" x="${x+w/2}" y="${y-5}" text-anchor="middle">${n}</text>`;
    g+=`<text x="${x+w/2}" y="${H-12}" text-anchor="middle">${q.replace(' 20',' ’')}</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Automations delivered per quarter">${g}</svg></div>`;
}

/* ---------- views ---------- */
function dropHtml(){
  return `<div class="drop" data-drop tabindex="0" role="button" aria-label="Choose a workbook to upload"><svg width="30" height="30" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11V2.5M4.5 6 8 2.5 11.5 6M2.5 10.5v2.5h11v-2.5"/></svg><b>Upload an updated workbook</b><span>Drop an .xlsx, .xls or .csv here, or click to choose a file. The whole library refreshes.</span><input type="file" data-file accept=".xlsx,.xls,.csv" hidden></div>`;
}
function viewHome(){
  const n = M.impls.length, tr = M.training.available.length+M.training.external.length+M.training.missing.length;
  const parts=[];
  if(M.plugins.length) parts.push(`${M.plugins.length} ${plural(M.plugins.length,'add-in')} evaluated`);
  if(n) parts.push(`${n} ${plural(n,'automation')} delivered on ${M.projects.length} ${plural(M.projects.length,'project')}`);
  if(tr) parts.push(`${tr} training ${plural(tr,'resource')}`);
  let h = `<div class="badges">${bdg('Workbook: '+SRC.file,'acc')}${SRC.at?bdg('Updated '+new Date(SRC.at).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})):bdg('Bundled data')}</div>
  <h1>Automation library</h1>
  <p class="lede">${parts.length?esc(parts.join(', '))+'.':'Upload a workbook to fill the library.'} Search everything with <span class="mono">/</span>, or click any bar below to open the matching list.</p>
  <div class="stats">${M.plugins.length?`<div class="stat"><b>${M.plugins.length}</b><span>add-ins reviewed</span></div>`:''}${n?`<div class="stat"><b>${n}</b><span>automations delivered</span></div><div class="stat"><b>${M.projects.length}</b><span>live projects</span></div>`:''}${tr?`<div class="stat"><b>${tr}</b><span>training items</span></div>`:''}</div>`;

/* ---------- sidebar ---------- */
const openSet=new Set(['impl']);
let curRoute='home';
function nodes(){
  const out=[];
  if(M.plugins.length) out.push({id:'plugins',label:'Add-ins & tools',count:M.plugins.length,route:'plugins',kids:M.plugins.map(p=>({label:p.title,route:'p.'+p.idx}))});
  if(M.impls.length) out.push({id:'impl',label:'Live projects',count:M.impls.length,route:'impl',kids:[{label:'All projects',route:'projects',n:M.projects.length}].concat(M.projects.map(p=>({label:p.name,route:'j.'+p.slug,n:p.count})))});
  const tn=M.training.available.length+M.training.external.length+M.training.missing.length;
  if(tn) out.push({id:'training',label:'Dynamo training',count:tn,route:'training',kids:[['available','Available'],['external','External sources'],['missing','Missing topics']].filter(k=>M.training[k[0]].length).map(k=>({label:k[1],route:'training.'+k[0],n:M.training[k[0]].length}))});
  M.generic.forEach((g,i)=>out.push({id:'s'+i,label:g.name,count:g.rows.length,route:'s.'+i,kids:[]}));
  return out;
}
function nodeOf(route){
  if(/^(plugins|p\.)/.test(route)) return 'plugins';
  if(/^(impl|projects|i\.|j\.)/.test(route)) return 'impl';
  if(/^training/.test(route)) return 'training';
  const m=route.match(/^s\.(\d+)/); return m?'s'+m[1]:'';
}
function buildSide(){
  $('#side').innerHTML=`<input class="tfilter" id="tf" type="search" placeholder="Filter the list" aria-label="Filter navigation" autocomplete="off"><h6>Library</h6><a class="lnk" href="#home" data-go="home" data-r="home">Overview</a><a class="lnk" href="#data" data-go="data" data-r="data">Update data</a><h6>Collections</h6><div id="tree"></div>`;
  $('#tf').addEventListener('input',drawTree);
  $('#tree').addEventListener('click',e=>{const ch=e.target.closest('.chev'); if(ch){e.preventDefault();e.stopPropagation();const n=ch.closest('.node').dataset.c; openSet.has(n)?openSet.delete(n):openSet.add(n); drawTree();}});
}
function drawTree(){
  const q=($('#tf')||{value:''}).value.trim().toLowerCase(), here=nodeOf(curRoute);
  const kidCur = r => r===curRoute || (/^i\./.test(curRoute)&&M.impls[+curRoute.slice(2)]&&r==='j.'+slugify(M.impls[+curRoute.slice(2)].project));
  let h='';
  nodes().forEach(n=>{
    const ks=q?n.kids.filter(k=>k.label.toLowerCase().includes(q)):n.kids;
    const hit=q&&n.label.toLowerCase().includes(q);
    if(q&&!ks.length&&!hit) return;
    const open=q?true:(openSet.has(n.id)||here===n.id);
    h+=`<div class="node ${open?'open':''} ${curRoute===n.route?'cur':''}" data-c="${n.id}"><a class="row" href="#${n.route}" data-go="${n.route}">${n.kids.length?`<button class="chev" tabindex="-1" aria-label="Toggle ${attr(n.label)}"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 1.5 6.5 5 3 8.5"/></svg></button>`:'<span class="chev"></span>'}<span class="nm">${esc(n.label)}</span><span class="ct">${n.count}</span></a><div class="kids">${(hit&&!ks.length?n.kids:ks).map(k=>`<a class="kid ${kidCur(k.route)?'cur':''}" href="#${k.route}" data-go="${k.route}"><span>${esc(k.label)}</span>${k.n!=null?`<span class="n">${k.n}</span>`:''}</a>`).join('')}</div></div>`;
  });
  $('#tree').innerHTML=h||'<div class="empty" style="padding:12px;font-size:13px">Nothing matches.</div>';
  document.querySelectorAll('#side .lnk').forEach(a=>a.classList.toggle('cur',a.dataset.r===curRoute));
  const act=document.querySelector('#tree .kid.cur');
  if(act&&!q){ try{ const s=$('#side'),r=act.getBoundingClientRect(),sr=s.getBoundingClientRect(); if(r.top<sr.top||r.bottom>sr.bottom) s.scrollTop+=r.top-sr.top-90; }catch(e){} }
}

/* ---------- router ---------- */
function render(route){
  route=route||'home'; curRoute=route; UP_ERR_KEEP();
  let html='', after=null, title='Automation Library', m;
  if(route==='home'){ html=viewHome(); }
  else if(route==='data'){ html=viewData(); title='Update data'; }
  else if(route==='plugins'){ html=viewPlugins(); after=()=>{bindF($('#main'),F.plugins,drawPlugins);drawPlugins();}; title='Add-ins & tools'; }
  else if((m=route.match(/^p\.(\d+)$/))&&M.plugins[+m[1]]){ const p=M.plugins[+m[1]]; html=viewPlugin(p); title=p.title; }
  else if(route==='impl'){ html=viewImpls(); after=()=>{bindF($('#main'),F.impl,drawImpls);drawImpls();}; title='Live projects'; }
  else if((m=route.match(/^i\.(\d+)$/))&&M.impls[+m[1]]){ const x=M.impls[+m[1]]; html=viewImpl(x); title=x.topic; }
  else if(route==='projects'){ html=viewProjects(); after=()=>{bindF($('#main'),F.projects,drawProjects);drawProjects();}; title='Projects'; }
  else if((m=route.match(/^j\.(.+)$/))&&M.projBySlug[m[1]]){ const p=M.projBySlug[m[1]]; html=viewProject(p); title=p.name; }
  else if(route==='training'||/^training\.(available|external|missing)$/.test(route)){ html=viewTraining(route.split('.')[1]); title='Dynamo training'; }
  else if((m=route.match(/^s\.(\d+)$/))&&M.generic[+m[1]]){ const i=+m[1]; html=viewGeneric(i); after=()=>{bindF($('#main'),F.gen[i],()=>drawGeneric(i));drawGeneric(i);}; title=M.generic[i].name; }
  else if((m=route.match(/^s\.(\d+)\.(\d+)$/))){ html=viewGenericRow(+m[1],+m[2]); }
  else { html=viewHome(); curRoute='home'; }
  $('#main').innerHTML=html;
  if(after) after();
  document.title=(title==='Automation Library'?'':title+' · ')+'Automation Library';
  drawTree(); window.scrollTo(0,0);
  document.body.classList.remove('nav'); $('#menuBtn').setAttribute('aria-expanded','false');
}
function UP_ERR_KEEP(){ if(curRoute!=='data'){ UP_ERR=''; } }
function go(r){ try{history.replaceState(null,'','#'+r);}catch(e){} render(r); }
window.addEventListener('hashchange',()=>render(location.hash.slice(1)));

function bindF(scope,state,draw){
  scope.querySelectorAll('[data-k]').forEach(el=>{
    const ev=el.tagName==='SELECT'?'change':'input';
    el.addEventListener(ev,()=>{ state[el.dataset.k]=el.value; if('limit' in state) state.limit=80; draw(); });
  });
}
function openList(kind,key,val,proj){
  if(kind==='impl'){ F.impl={q:'',disc:'',cat:'',sol:'',quarter:'',project:proj||'',by:'',limit:80}; F.impl[key]=val; go('impl'); }
  else if(kind==='plugins'){ F.plugins={q:'',paid:'',test:'',concl:'',disc:''}; F.plugins[key]=val; go('plugins'); }
}

/* ---------- search ---------- */
function buildIndex(){
  INDEX=[];
  M.plugins.forEach(p=>INDEX.push({k:'P',route:'p.'+p.idx,title:p.title,sub:'Add-in · '+(p.suite||p.discRaw||'')+(p.purpose?' · '+p.purpose.split('\n')[0]:''),name:p.title.toLowerCase(),hay:(p.title+' '+p.suite+' '+p.purpose+' '+p.desc+' '+p.notes.join(' ')+' '+p.owner+' '+p.cat).toLowerCase()}));
  M.impls.forEach(x=>INDEX.push({k:'A',route:'i.'+x.idx,title:x.topic,sub:x.project+' · '+x.sol+(x.date?' · '+fmtDate(x.date):''),name:x.topic.toLowerCase(),hay:(x.topic+' '+x.project+' '+x.desc+' '+x.res+' '+x.ben+' '+x.byRaw+' '+x.cat).toLowerCase()}));
  M.projects.forEach(p=>INDEX.push({k:'J',route:'j.'+p.slug,title:p.name,sub:'Project · '+p.count+' '+plural(p.count,'automation'),name:p.name.toLowerCase(),hay:p.name.toLowerCase()}));
  ['available','external','missing'].forEach(s=>M.training[s].forEach(t=>INDEX.push({k:'T',route:'training.'+s,title:t.title,sub:'Training · '+s,name:t.title.toLowerCase(),hay:(t.title+' '+t.desc+' '+t.remarks).toLowerCase()})));
  M.generic.forEach((g,i)=>g.rows.forEach(r=>INDEX.push({k:'R',route:'s.'+i+'.'+r.idx,title:r.title,sub:g.name,name:r.title.toLowerCase(),hay:r.values.join(' ').toLowerCase()})));
}
let sel=0;
function search(q){
  q=q.trim().toLowerCase(); if(!q) return [];
  const toks=q.split(/\s+/), out=[];
  INDEX.forEach(e=>{
    if(!toks.every(t=>e.hay.includes(t))) return;
    let s=1; if(e.name===q) s=100; else if(e.name.startsWith(q)) s=60; else if(e.name.includes(q)) s=40; else if(toks.every(t=>e.name.includes(t))) s=30;
    if(e.k==='J') s+=6; out.push({e,s});
  });
  return out.sort((a,b)=>b.s-a.s||a.e.title.length-b.e.title.length).slice(0,30).map(x=>x.e);
}
function hl(t,q){ const w=q.trim().toLowerCase().split(/\s+/)[0], i=t.toLowerCase().indexOf(w); return i<0?esc(t):esc(t.slice(0,i))+'<b>'+esc(t.slice(i,i+w.length))+'</b>'+esc(t.slice(i+w.length)); }
function drawRes(){
  const q=$('#q').value, box=$('#res');
  if(!q.trim()){box.hidden=true;$('#q').setAttribute('aria-expanded','false');return;}
  const list=search(q); sel=0; box.hidden=false; $('#q').setAttribute('aria-expanded','true');
  box.innerHTML=list.length?list.map((e,i)=>`<div class="item" role="option" data-route="${attr(e.route)}" aria-selected="${i===0}"><span class="ty">${e.k}</span><div style="min-width:0"><div class="t">${hl(e.title,q)}</div><div class="s">${esc(e.sub)}</div></div></div>`).join(''):'<div class="none">No matches. Try a shorter word, like “sheet” or “schedule”.</div>';
}
function moveSel(d){ const it=[...document.querySelectorAll('#res .item')]; if(!it.length) return; sel=(sel+d+it.length)%it.length; it.forEach((x,i)=>x.setAttribute('aria-selected',i===sel)); it[sel].scrollIntoView({block:'nearest'}); }
function closeRes(){ $('#res').hidden=true; $('#q').setAttribute('aria-expanded','false'); }
function pick(route){ go(route); $('#q').value=''; closeRes(); $('#q').blur(); }
$('#q').addEventListener('input',drawRes); $('#q').addEventListener('focus',drawRes);
$('#q').addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();moveSel(1);} else if(e.key==='ArrowUp'){e.preventDefault();moveSel(-1);}
  else if(e.key==='Enter'){const it=document.querySelectorAll('#res .item')[sel]; if(it) pick(it.dataset.route);}
  else if(e.key==='Escape'){$('#q').value='';closeRes();$('#q').blur();}
});
$('#res').addEventListener('mousedown',e=>{const it=e.target.closest('.item'); if(it){e.preventDefault();pick(it.dataset.route);}});
document.addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'');
  if((e.key==='/'&&!typing)||((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k')){e.preventDefault();$('#q').focus();$('#q').select();}
  if(e.key==='Escape'){ closePop(); }
});

/* ---------- upload ---------- */
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200);}
function cellVal(v){
  if(v==null) return null;
  if(v instanceof Date) return new Date(v.getTime()+12*3600e3).toISOString().slice(0,10);
  if(typeof v==='number') return Number.isInteger(v)?v:Math.round(v*1e6)/1e6;
  if(typeof v==='boolean') return v?'TRUE':'FALSE';
  const s=String(v).replace(/\r/g,''); return s.trim()?s:null;
}
function sheetRows(X,ws){
  const rows=X.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:false});
  return rows.map(r=>{ const c=r.map(cellVal); while(c.length&&c[c.length-1]==null) c.pop(); return c; }).filter(r=>r.length);
}
async function handleFile(file){
  if(!file) return;
  UP_ERR='';
  try{
    if(!window.XLSX) throw new Error('The spreadsheet reader did not load. Check your connection and try again.');
    if(!/\.(xlsx|xlsm|xls|csv)$/i.test(file.name)) throw new Error('Please choose an .xlsx, .xls or .csv file.');
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array',cellDates:true});
    const sheets=wb.SheetNames.map(n=>({name:n.trim(),rows:sheetRows(XLSX,wb.Sheets[n])})).filter(s=>s.rows.length);
    if(!sheets.length) throw new Error('The file has no rows with data.');
    const raw={file:file.name,sheets};
    const next=buildModel(raw);
    const known=next.plugins.length+next.impls.length+next.training.available.length+next.training.external.length+next.training.missing.length;
    if(!known && !next.generic.length) throw new Error('None of the sheets had a heading row the library could use.');
    LAST_DIFF=diffModels(M,next);
    M=next; RAW=raw; SRC={file:file.name,at:Date.now(),bundled:false,saved:false};
    try{ localStorage.setItem(STORE,JSON.stringify({file:raw.file,at:SRC.at,sheets:raw.sheets})); SRC.saved=true; }catch(e){}
    F.plugins={q:'',paid:'',test:'',concl:'',disc:''}; F.impl={q:'',disc:'',cat:'',sol:'',quarter:'',project:'',by:'',limit:80}; F.projects={q:''}; F.gen={};
    buildIndex(); buildSide(); go('data'); toast('Library updated');
  }catch(err){
    UP_ERR=(err&&err.message)||'Something went wrong while reading the file.'; go('data');
  }
}
function resetData(){
  try{localStorage.removeItem(STORE);}catch(e){}
  LAST_DIFF=diffModels(M,buildModel(BUNDLED));
  M=buildModel(BUNDLED); RAW=BUNDLED; SRC={file:BUNDLED.file,at:null,bundled:true,saved:false};
  F.plugins={q:'',paid:'',test:'',concl:'',disc:''}; F.impl={q:'',disc:'',cat:'',sol:'',quarter:'',project:'',by:'',limit:80}; F.projects={q:''}; F.gen={};
  buildIndex(); buildSide(); LAST_DIFF=null; go('data'); toast('Bundled data restored');
}
let dragDepth=0;
const hasFiles=e=>e.dataTransfer&&[...(e.dataTransfer.types||[])].includes('Files');
window.addEventListener('dragenter',e=>{ if(hasFiles(e)){ dragDepth++; $('#dzo').hidden=false; } });
window.addEventListener('dragover',e=>{ if(hasFiles(e)) e.preventDefault(); });
window.addEventListener('dragleave',e=>{ if(hasFiles(e)){ dragDepth=Math.max(0,dragDepth-1); if(!dragDepth) $('#dzo').hidden=true; } });
window.addEventListener('drop',e=>{ if(hasFiles(e)){ e.preventDefault(); dragDepth=0; $('#dzo').hidden=true; handleFile(e.dataTransfer.files[0]); } });

/* ---------- clicks ---------- */
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-go]');
  if(a&&!e.metaKey&&!e.ctrlKey&&!e.shiftKey){ if(e.target.closest('.chev')) return; e.preventDefault(); go(a.dataset.go); return; }
  const op=e.target.closest('[data-open]');
  if(op){ openList(op.dataset.open,op.dataset.key,op.dataset.val,op.dataset.proj); return; }
  const cl=e.target.closest('[data-clear]');
  if(cl){ if(cl.dataset.clear==='impl') F.impl={q:'',disc:'',cat:'',sol:'',quarter:'',project:'',by:'',limit:80}; else F.plugins={q:'',paid:'',test:'',concl:'',disc:''}; render(curRoute); return; }
  if(e.target.closest('[data-more]')){ F.impl.limit+=80; drawImpls(); return; }
  if(e.target.closest('[data-gmore]')){ const i=+curRoute.split('.')[1]; F.gen[i].limit+=80; drawGeneric(i); return; }
  if(e.target.closest('[data-reset]')){ resetData(); return; }
  const dz=e.target.closest('[data-drop]');
  if(dz){ const inp=dz.querySelector('[data-file]'); if(e.target!==inp) inp.click(); return; }
  if(!e.target.closest('.srch')) closeRes();
  if(!e.target.closest('.right')) closePop();
});
document.addEventListener('change',e=>{ const f=e.target.closest('[data-file]'); if(f&&f.files[0]){ handleFile(f.files[0]); f.value=''; } });
document.addEventListener('keydown',e=>{ const dz=e.target.closest&&e.target.closest('[data-drop]'); if(dz&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); dz.querySelector('[data-file]').click(); } });
document.addEventListener('dragover',e=>{ const dz=e.target.closest&&e.target.closest('[data-drop]'); if(dz) dz.classList.add('on'); });
document.addEventListener('dragleave',e=>{ const dz=e.target.closest&&e.target.closest('[data-drop]'); if(dz) dz.classList.remove('on'); });
$('#menuBtn').addEventListener('click',()=>{const o=document.body.classList.toggle('nav');$('#menuBtn').setAttribute('aria-expanded',String(o));});
$('#scrim').addEventListener('click',()=>{document.body.classList.remove('nav');$('#menuBtn').setAttribute('aria-expanded','false');});

/* chart tooltip */
const tip=document.createElement('div'); tip.className='tip'; tip.hidden=true; document.body.appendChild(tip);
document.addEventListener('mousemove',e=>{ const b=e.target.closest&&e.target.closest('[data-tip]'); if(!b){tip.hidden=true;return;} tip.textContent=b.dataset.tip; tip.hidden=false; tip.style.left=(e.clientX+12)+'px'; tip.style.top=(e.clientY+14)+'px'; });

/* ---------- theme ---------- */
const PALS=[['blue','Blueprint',222,42],['teal','Teal',175,28],['forest','Forest',145,28],['amber','Amber',36,30],['rose','Rose',335,42],['violet','Violet',265,48]];
let mode='auto', pal='blue';
try{ const t=JSON.parse(localStorage.getItem(THEME)||'{}'); if(['auto','light','dark'].includes(t.mode)) mode=t.mode; if(PALS.some(p=>p[0]===t.pal)) pal=t.pal; }catch(e){}
function applyTheme(){
  const r=document.documentElement;
  if(mode==='auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme',mode);
  if(pal==='blue') r.removeAttribute('data-palette'); else r.setAttribute('data-palette',pal);
  document.querySelectorAll('#modeSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));
  document.querySelectorAll('#palGrid button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.pal===pal));
  try{localStorage.setItem(THEME,JSON.stringify({mode,pal}));}catch(e){}
}
$('#palGrid').innerHTML=PALS.map(p=>`<button data-pal="${p[0]}" aria-pressed="false"><i style="background:linear-gradient(90deg,hsl(${p[2]} 72% ${p[3]}%),hsl(${p[2]} 85% 68%))"></i>${p[1]}</button>`).join('');
$('#modeSeg').addEventListener('click',e=>{const b=e.target.closest('[data-mode]'); if(b){mode=b.dataset.mode;applyTheme();}});
$('#palGrid').addEventListener('click',e=>{const b=e.target.closest('[data-pal]'); if(b){pal=b.dataset.pal;applyTheme();}});
function closePop(){ $('#themePop').hidden=true; $('#themeBtn').setAttribute('aria-expanded','false'); }
$('#themeBtn').addEventListener('click',()=>{ const h=$('#themePop').hidden; $('#themePop').hidden=!h; $('#themeBtn').setAttribute('aria-expanded',String(h)); });
applyTheme();

buildIndex(); buildSide(); render(location.hash.slice(1));
})();
</script>
